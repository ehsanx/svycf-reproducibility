      "Authors@R": "c( person(\"M Ehsan\", \"Karim\", role = c(\"aut\", \"cre\"), email = \"ehsan.karim@gmail.com\", comment = c(affiliation = \"University of British Columbia\")))",
      "Description": "Estimates the population average treatment effect (ATE) from complex survey data with a cross-fitted, survey-weighted Targeted Maximum Likelihood Estimator (TMLE) and a design-based (Taylor-series linearization) variance that treats the first-stage sampling unit as the independent replication unit. Cross-fitting at the sampling-unit level lets flexible machine-learning nuisance estimators stay valid under stratified, multistage, unequal-probability sampling, with confidence intervals on a t reference with the survey design degrees of freedom. Also supports sub-population (domain) analyses, risk-ratio and odds-ratio estimands, continuous outcomes, multiple imputation, replicate-weight variance, and a survey-weighted augmented inverse-probability-weighting comparator, plus variance-method and compute benchmarks and a panel of design-awareness comparison estimators. The method is described in Karim (2026, submitted); see 'citation(\"svytmle\")'.",
